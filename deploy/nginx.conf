# MathStudy.in — Nginx reverse proxy for the Node/Express app (PM2 on 127.0.0.1:3001)
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/mathstudy.in
#   sudo ln -s /etc/nginx/sites-available/mathstudy.in /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then add HTTPS automatically:
#   sudo certbot --nginx -d mathstudy.in -d www.mathstudy.in
# Certbot rewrites this file to add the SSL :443 server block and an HTTP->HTTPS
# redirect. The :80 block below is what it starts from.

# Redirect the www host to the apex (do canonicalisation at the edge).
server {
    listen 80;
    listen [::]:80;
    server_name www.mathstudy.in;
    return 301 http://mathstudy.in$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name mathstudy.in;

    # Let's Encrypt HTTP-01 challenge (certbot also handles this automatically).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Allow PDF / image uploads through (multer). Match or exceed any in-app limit.
    client_max_body_size 25m;

    # gzip text assets.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Cache static assets served from /public (Express also serves these).
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }
}
